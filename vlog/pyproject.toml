[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-vlog"
version = "0.1.0"
description = "Offline SQLite workflow bootstrap for vlog production"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
neo-vlog = "neo_vlog.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
