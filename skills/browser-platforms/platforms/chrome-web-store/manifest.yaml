platform: chrome-web-store
status: verified
last_verified: 2026-09-26
browser_harness:
  compatible: true
  runner: "browser-harness/_chrome_web_store_bh.py"
  evidence: "Runner uses browser-harness helpers and emits observed evidence; Browser Workspace new-item draft was created and reopened successfully."
url_patterns:
  - "https://chromewebstore.google.com/devconsole/*"
  - "https://chrome.google.com/webstore/developer/dashboard*"
authentication:
  required: true
  notes: "Use an already authenticated publisher session; never store credentials or session state."
side_effects:
  - "upload-package changes a draft/package upload"
  - "update-listing edits listing metadata"
  - "submit-review sends a listing for review"
provenance:
  source: "Neo platform skeleton"
  migrated_code: false
flows:
  resolve-item: {status: working, evidence: "Runner deterministically reuses a matching publisher item or creates one only with explicit commit authorization."}
  create-item: {status: working, evidence: "Runner uploads the initial package and captures the publisher-scoped item id; verify-draft proves the exact version after reopen."}
  verify-draft: {status: working, evidence: "Runner reopens the exact publisher item and verifies draft status plus the dashboard package version."}
  save-draft: {status: working, evidence: "Runner reopens an explicitly selected item and verifies the Save draft control before saving."}
  open-item: {status: working, evidence: "Runner resolves the exact item and records the observed URL."}
  create-item: {status: working, evidence: "Runner creates a new publisher item from an explicit package only when commit is enabled."}
  upload-package: {status: working, evidence: "Runner uploads the configured ZIP only when commit is explicitly enabled."}
  update-listing: {status: working, evidence: "Runner maps approved Market Package fields and records draft evidence."}
  submit-review: {status: working, evidence: "Runner requires commit plus explicit external-submit authorization."}
  check-status: {status: working, evidence: "Runner classifies observed review/listing state without treating submission as publication."}
  verify-published: {status: working, evidence: "Runner requires an observed public listing and exact expected version."}
