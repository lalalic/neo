interface:
  display_name: "XChat Orchestrator"
  short_description: "Drive coding tasks through PR completion"
  default_prompt: "Use @orchestrator ($xchat-orchestrator) to drive this repository task through implementation, review, and completion."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "Read pull requests, reviews, comments, patches, and checks."
      transport: "streamable_http"
    - type: "mcp"
      value: "neo"
      description: "Run authenticated local repository, shell, filesystem, and Codex work on the Mac through NeoY."
      transport: "streamable_http"

policy:
  allow_implicit_invocation: true
