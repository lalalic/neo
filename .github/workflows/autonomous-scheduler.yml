name: Autonomous scheduler

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: agents-relay-autonomous-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Process due autonomous buckets
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx --yes --package agents-relay@1.0.162 agents-relay tick --repo "$GITHUB_REPOSITORY"
