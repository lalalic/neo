name: Publish Neo CLI
on:
  workflow_dispatch:
  push:
    tags: ['neo-cli-v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0
      - name: Portable source tests
        run: node --test --test-skip-pattern='live non-mutating CLI project route' test/*.test.mjs
      - name: Stage CLI distribution
        run: node scripts/stage-neo-cli.mjs "$RUNNER_TEMP/neo-cli-dist"
      - name: Verify release identity
        working-directory: ${{ runner.temp }}/neo-cli-dist
        run: |
          node -e 'const p=require("./package.json");if(p.name!=="@lalalic/neo"||p.version!=="1.0.2"||p.private||!p.bin.neo)process.exit(1)'
          node .bin/neo.mjs --help
          npm pack --dry-run --ignore-scripts
      - name: Publish with npm Trusted Publisher OIDC
        working-directory: ${{ runner.temp }}/neo-cli-dist
        run: npm publish --provenance --access public
