name: Build native Neo CLI
on:
  workflow_dispatch:
  push:
    tags: ['neo-cli-v*']
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p neo-harness-cli --bin neo-rs
      - run: cargo test --locked -p neo-harness-cli --lib
      - name: Stage native release
        run: |
          NEO_HARNESS_ROOT="$GITHUB_WORKSPACE" target/release/neo-rs package stage "$RUNNER_TEMP/neo-cli-dist"
          "$RUNNER_TEMP/neo-cli-dist/bin/neo" --help
          tar -czf "$RUNNER_TEMP/neo-cli.tar.gz" -C "$RUNNER_TEMP/neo-cli-dist" .
      - uses: actions/upload-artifact@v4
        with:
          name: neo-cli-${{ matrix.os }}
          path: ${{ runner.temp }}/neo-cli.tar.gz
