name: Neo Compute tiny Dockerfile E2E
on:
  push:
    branches: [main]
    paths:
      - 'compute/**'
      - 'crates/neo-cli/**'
      - 'skills/neo-compute/**'
      - 'test/neo-compute-*.test.mjs'
      - 'test/neo-compute-container-*.test.mjs'
      - '.github/workflows/neo-compute-e2e.yml'
  pull_request:
    paths:
      - 'compute/**'
      - 'crates/neo-cli/**'
      - 'skills/neo-compute/**'
      - 'test/neo-compute-*.test.mjs'
      - 'test/neo-compute-container-*.test.mjs'
      - '.github/workflows/neo-compute-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tiny-dockerfile-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Native Compute contracts
        run: cargo test --locked -p neo-harness-cli --test compute_native --test compute_gateway --test compute_transport
      - name: Independent container workload tests
        run: NEO_CLI_BIN="$GITHUB_WORKSPACE/target/debug/neo-rs" node --test test/neo-compute-e2e.test.mjs test/neo-compute-hello.test.mjs test/neo-compute-container-*.test.mjs test/neo-compute-comfyui.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Real Dockerfile to Neo batch and web HTTP E2E (no cloud spend)
        run: node compute/e2e/container-smoke.mjs
