name: Neo GPU tiny Dockerfile E2E
on:
  push:
    branches: [main]
    paths:
      - 'gpu/**'
      - 'test/neo-gpu*.test.mjs'
      - '.github/workflows/neo-gpu-e2e.yml'
  pull_request:
    paths:
      - 'gpu/**'
      - 'test/neo-gpu*.test.mjs'
      - '.github/workflows/neo-gpu-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tiny-dockerfile-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local Node GPU job and web unit tests
        run: node --test test/neo-gpu-e2e.test.mjs test/neo-gpu-node.test.mjs test/neo-gpu-web.test.mjs test/neo-gpu.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Real Dockerfile to Neo batch and web HTTP E2E (no cloud spend)
        run: node gpu/e2e/container-smoke.mjs
