[package]
name = "neo-models"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Neo Models Gateway"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "=1.13.1"
getrandom = "=0.4.3"
base64 = "=0.23.1"
sha2 = "=0.10.9"
tempfile = "3"
url = "=2.5.8"
libc = "0.2"
ureq = { version = "=3.5.2", default-features = false, features = ["json", "rustls"] }
tiny_http = "=0.12.0"
