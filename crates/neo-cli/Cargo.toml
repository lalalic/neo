[package]
name = "neo-harness-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Neo Harness CLI, migrated slice-by-slice from the Node.js reference"

[[bin]]
name = "neo-rs"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
